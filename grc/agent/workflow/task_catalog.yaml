{
  "schema_version": 1,
  "task_candidates": {
    "END_TO_END_SIM": {
      "description": "构建端到端通信系统并完成仿真验证",
      "stages": [
        {"id": "spec_alignment", "interaction": "conditional_checkpoint", "recommended_agents": ["spec_agent"], "completion": ["required_slots_complete"], "on": {"approved": "build_and_verify", "rejected": "cancelled"}},
        {"id": "build_and_verify", "interaction": "autonomous", "recommended_agents": ["radio_design_agent", "flowgraph_agent", "verification_agent", "diagnosis_agent"], "completion": ["flowgraph_saved", "structural_validation_completed", "measurement_completed", "affected_claims_evaluated"], "depends_on": ["spec.architecture", "project.flowgraph", "success_conditions"], "max_attempts": 2, "on": {"passed": "completed", "failed_with_improvement": "build_and_verify", "failed_without_improvement": "waiting_user", "errored": "stop"}}
      ]
    },
    "TX_BUILD": {
      "description": "构建发射链路并完成结构校验",
      "stages": [
        {"id": "spec_alignment", "interaction": "conditional_checkpoint", "recommended_agents": ["spec_agent"], "completion": ["required_slots_complete"], "on": {"approved": "tx_build_and_validate", "rejected": "cancelled"}},
        {"id": "tx_build_and_validate", "interaction": "autonomous", "recommended_agents": ["radio_design_agent", "flowgraph_agent", "verification_agent"], "completion": ["flowgraph_saved", "structural_validation_completed"], "max_attempts": 2, "on": {"passed": "completed", "failed_with_improvement": "tx_build_and_validate", "failed_without_improvement": "waiting_user", "errored": "stop"}}
      ]
    },
    "RX_BUILD": {
      "description": "构建接收链路并验证接收质量",
      "stages": [
        {"id": "rx_spec_alignment", "interaction": "conditional_checkpoint", "recommended_agents": ["spec_agent"], "completion": ["required_slots_complete"], "on": {"approved": "rx_build_and_verify", "rejected": "cancelled"}},
        {"id": "rx_build_and_verify", "interaction": "autonomous", "recommended_agents": ["radio_design_agent", "flowgraph_agent", "verification_agent", "diagnosis_agent"], "completion": ["flowgraph_saved", "structural_validation_completed", "receive_quality_evaluated"], "max_attempts": 2, "on": {"passed": "completed", "failed_with_improvement": "rx_build_and_verify", "failed_without_improvement": "waiting_user", "errored": "stop"}}
      ]
    },
    "DIAGNOSE": {
      "description": "检查当前工程并基于 Evidence 诊断",
      "stages": [
        {"id": "inspect_and_diagnose", "interaction": "autonomous", "recommended_agents": ["verification_agent", "diagnosis_agent"], "completion": ["diagnosis_created"], "on": {"passed": "completed", "failed": "repair_confirmation", "errored": "stop"}},
        {"id": "repair_confirmation", "interaction": "conditional_checkpoint", "recommended_agents": ["diagnosis_agent"], "completion": ["repair_decision_recorded"], "on": {"approved": "repair_and_verify", "rejected": "completed"}},
        {"id": "repair_and_verify", "interaction": "autonomous", "recommended_agents": ["flowgraph_agent", "verification_agent", "diagnosis_agent"], "completion": ["repair_applied", "affected_claims_evaluated"], "max_attempts": 2, "on": {"passed": "completed", "failed_with_improvement": "repair_and_verify", "failed_without_improvement": "waiting_user", "errored": "stop"}}
      ]
    },
    "MODIFY_PROJECT": {
      "description": "修改已有 GNU Radio 工程",
      "stages": [
        {"id": "inspect_and_plan", "interaction": "autonomous", "recommended_agents": ["spec_agent", "flowgraph_agent"], "completion": ["change_plan_created"], "on": {"passed": "change_confirmation", "errored": "stop"}},
        {"id": "change_confirmation", "interaction": "conditional_checkpoint", "when": {"any": ["modulation_change", "recipe_change", "multi_block_change", "hardware_change"]}, "recommended_agents": ["flowgraph_agent"], "completion": ["change_decision_recorded"], "on": {"approved": "apply_and_verify", "rejected": "cancelled", "not_required": "apply_and_verify"}},
        {"id": "apply_and_verify", "interaction": "autonomous", "recommended_agents": ["flowgraph_agent", "verification_agent", "diagnosis_agent"], "completion": ["flowgraph_saved", "structural_validation_completed", "affected_claims_evaluated"], "max_attempts": 2, "on": {"passed": "completed", "failed_with_improvement": "apply_and_verify", "failed_without_improvement": "waiting_user", "errored": "stop"}}
      ]
    },
    "OBSERVE": {
      "description": "观察当前工程结构、信号和指标",
      "stages": [
        {"id": "inspect_and_measure", "interaction": "autonomous", "recommended_agents": ["flowgraph_agent", "verification_agent"], "completion": ["measurement_completed"], "on": {"passed": "completed", "failed": "waiting_user", "errored": "stop"}}
      ]
    },
    "HARDWARE_CONFIGURE": {
      "description": "规划或配置 SDR 系统",
      "stages": [
        {"id": "hardware_precheck", "interaction": "autonomous", "recommended_agents": ["hardware_agent"], "completion": ["hardware_precheck_completed"], "on": {"passed": "hardware_confirmation", "failed": "waiting_user", "errored": "stop"}},
        {"id": "hardware_confirmation", "interaction": "checkpoint", "recommended_agents": ["hardware_agent"], "completion": ["hardware_decision_recorded"], "on": {"approved": "configure_and_check", "rejected": "cancelled"}},
        {"id": "configure_and_check", "interaction": "autonomous", "recommended_agents": ["hardware_agent", "verification_agent"], "completion": ["configuration_recorded", "hardware_check_completed"], "on": {"passed": "completed", "failed": "waiting_user", "errored": "stop"}}
      ],
      "runtime_stages": [
        {"id": "hardware_precheck", "interaction": "autonomous", "recommended_agents": ["hardware_agent"], "completion": ["hardware_precheck_completed"], "on": {"passed": "discover_and_probe_hardware", "failed": "waiting_user", "errored": "stop"}},
        {"id": "discover_and_probe_hardware", "interaction": "autonomous", "recommended_agents": ["hardware_agent"], "completion": ["device_discovered", "device_probed"], "on": {"passed": "rf_plan_confirmation", "failed": "waiting_user", "errored": "stop"}},
        {"id": "rf_plan_confirmation", "interaction": "checkpoint", "recommended_agents": ["hardware_agent"], "completion": ["rf_plan_approved"], "on": {"approved": "configure_device", "rejected": "cancelled"}},
        {"id": "configure_device", "interaction": "autonomous", "recommended_agents": ["hardware_agent"], "completion": ["configuration_recorded"], "on": {"passed": "run_bounded", "failed": "waiting_user", "errored": "stop"}},
        {"id": "run_bounded", "interaction": "autonomous", "recommended_agents": ["hardware_agent"], "completion": ["runtime_started"], "on": {"passed": "runtime_observation", "failed": "waiting_user", "errored": "stop"}},
        {"id": "runtime_observation", "interaction": "checkpoint", "recommended_agents": ["hardware_agent"], "completion": ["runtime_observation_recorded"], "on": {"approved": "stop_runtime", "rejected": "stop_runtime"}},
        {"id": "stop_runtime", "interaction": "autonomous", "recommended_agents": ["hardware_agent"], "completion": ["runtime_stopped"], "on": {"passed": "completed", "failed": "stop", "errored": "stop"}}
      ],
      "deploy_stages": [
        {"id": "protocol_spec_alignment", "interaction": "conditional_checkpoint", "recommended_agents": ["spec_agent", "protocol_agent"], "completion": ["required_slots_complete"], "on": {"approved": "build_ble_advertiser", "rejected": "cancelled"}},
        {"id": "build_ble_advertiser", "interaction": "autonomous", "recommended_agents": ["protocol_agent", "flowgraph_agent"], "completion": ["ble_packet_created", "ble_waveform_generated", "flowgraph_saved"], "on": {"passed": "offline_protocol_verify", "failed": "waiting_user", "errored": "stop"}},
        {"id": "offline_protocol_verify", "interaction": "autonomous", "recommended_agents": ["protocol_agent", "verification_agent"], "completion": ["ble_packet_valid", "structural_validation_completed"], "on": {"passed": "discover_and_probe_device", "failed": "waiting_user", "errored": "stop"}},
        {"id": "discover_and_probe_device", "interaction": "autonomous", "recommended_agents": ["hardware_agent"], "completion": ["device_discovered", "device_probed"], "on": {"passed": "rf_plan_confirmation", "failed": "waiting_user", "errored": "stop"}},
        {"id": "rf_plan_confirmation", "interaction": "checkpoint", "recommended_agents": ["hardware_agent"], "completion": ["rf_plan_approved"], "on": {"approved": "configure_device", "rejected": "cancelled"}},
        {"id": "configure_device", "interaction": "autonomous", "recommended_agents": ["hardware_agent"], "completion": ["configuration_recorded"], "on": {"passed": "transmit_bounded", "failed": "waiting_user", "errored": "stop"}},
        {"id": "transmit_bounded", "interaction": "autonomous", "recommended_agents": ["hardware_agent"], "completion": ["transmit_started"], "on": {"passed": "over_air_verification", "failed": "waiting_user", "errored": "stop"}},
        {"id": "over_air_verification", "interaction": "checkpoint", "recommended_agents": ["hardware_agent"], "completion": ["over_air_observed"], "on": {"approved": "stop_and_finalize", "rejected": "stop_and_finalize"}},
        {"id": "stop_and_finalize", "interaction": "autonomous", "recommended_agents": ["hardware_agent"], "completion": ["transmit_stopped"], "on": {"passed": "completed", "failed": "stop", "errored": "stop"}}
      ]
    }
  }
}
