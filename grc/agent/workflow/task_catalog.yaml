        {"id": "stop_and_finalize", "interaction": "autonomous", "effect_level": "RF_RUN", "safety_finalizer": true, "recommended_agents": ["hardware_agent"], "completion": ["transmit_stopped"], "on": {"passed": "completed", "failed": "stop", "errored": "stop"}}
