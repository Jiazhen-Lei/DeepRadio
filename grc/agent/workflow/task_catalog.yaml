        {"id": "transmit_bounded", "interaction": "autonomous", "effect_level": "RF_RUN", "idempotent": false, "recommended_agents": ["hardware_agent"], "completion": ["transmit_started"], "depends_on": ["project.flowgraph", "hardware.identity"], "on": {"passed": "over_air_verification", "failed": "waiting_user", "errored": "stop"}},
