        {"id": "hardware_precheck", "interaction": "autonomous", "effect_level": "DEVICE_READ", "recommended_agents": ["hardware_agent"], "completion": ["hardware_precheck_completed"], "on": {"passed": "discover_and_probe_hardware", "failed": "waiting_user", "errored": "stop"}},
        {"id": "discover_and_probe_hardware", "interaction": "autonomous", "effect_level": "DEVICE_READ", "recommended_agents": ["hardware_agent"], "completion": ["device_discovered", "device_probed"], "depends_on": ["hardware.identity"], "on": {"passed": "rf_plan_confirmation", "failed": "waiting_user", "errored": "stop"}},
        {"id": "rf_plan_confirmation", "interaction": "checkpoint", "recommended_agents": ["hardware_agent"], "completion": ["rf_plan_approved"], "on": {"approved": "configure_device", "rejected": "cancelled"}},
