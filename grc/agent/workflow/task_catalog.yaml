        {"id": "apply_and_verify", "interaction": "autonomous", "recommended_agents": ["flowgraph_agent", "verification_agent", "diagnosis_agent"], "completion": ["flowgraph_saved", "structural_validation_completed", "affected_claims_evaluated"], "max_attempts": 2, "on": {"passed": "completed", "failed_with_improvement": "apply_and_verify", "failed_without_improvement": "waiting_user", "errored": "stop"}}
      ]
