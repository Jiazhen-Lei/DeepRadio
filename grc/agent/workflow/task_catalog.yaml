        {"id": "run_bounded", "interaction": "autonomous", "effect_level": "RF_RUN", "idempotent": false, "recommended_agents": ["hardware_agent"], "completion": ["runtime_started"], "on": {"passed": "runtime_observation", "failed": "waiting_user", "errored": "stop"}},
